<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Legal Risk Manual Review Workbench</title>
  <style>
    :root {
      --page-bg: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-strong: #edf6f5;
      --text: #1f2937;
      --muted: #556274;
      --faint: #7b8798;
      --primary: #0f766e;
      --primary-ink: #084f49;
      --blue: #2563eb;
      --warning: #d58918;
      --danger: #e14b5a;
      --success: #22a866;
      --border: rgba(129, 140, 160, 0.28);
      --shadow: 0 18px 48px rgba(31, 41, 55, 0.08);
      --radius: 8px;
      --font: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html {
      height: 100%;
    }
    body {
      margin: 0;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text);
      font-family: var(--font);
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-shell {
      display: grid;
      grid-template-columns: minmax(240px, 288px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      min-height: 0;
      height: 100%;
      max-height: 100vh;
      padding: 22px 18px;
      border-right: 1px solid var(--border);
      background: #fbfcff;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: auto;
    }

    .brand {
      display: grid;
      gap: 8px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .brand-kicker {
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .nav-section, .sidebar-panel {
      display: grid;
      gap: 8px;
    }
    .section-title {
      color: var(--faint);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .nav-button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }
    .nav-button:hover, .nav-button.active {
      border-color: rgba(15, 118, 110, 0.25);
      background: var(--surface-strong);
      color: var(--primary-ink);
    }
    .nav-button span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count {
      min-width: 28px;
      border-radius: 999px;
      padding: 2px 8px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .main {
      min-width: 0;
      min-height: 0;
      height: 100%;
      max-height: 100vh;
      padding: 22px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 16px;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }
    .topbar-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.blocked { color: #9a5b00; background: #fff8e7; border-color: rgba(213, 137, 24, 0.34); }
    .badge.ready { color: #0b7a48; background: #edfff5; border-color: rgba(34, 168, 102, 0.28); }
    .badge.danger { color: #b72d3a; background: #fff1f3; border-color: rgba(225, 75, 90, 0.28); }
    .language-control {
      min-height: 32px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      padding: 3px 4px 3px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .language-select {
      min-height: 24px;
      border: 0;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      outline: none;
    }
    .language-select:focus {
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
    }
    .kpi {
      min-height: 82px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      display: grid;
      align-content: space-between;
    }
    .kpi-value {
      font-size: 26px;
      line-height: 1;
      font-weight: 800;
    }
    .kpi-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .workspace {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(330px, 0.42fr) minmax(0, 0.58fr);
      gap: 16px;
      overflow: hidden;
    }
    .panel {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      display: grid;
      overflow: hidden;
    }
    .queue-panel {
      grid-template-rows: auto auto auto minmax(0, 1fr);
    }
    .detail-panel {
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    .panel-header {
      min-height: 62px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-header h3 {
      margin: 0;
      font-size: 15px;
    }
    .panel-header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .search-row {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .import-row {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 8px;
      background: var(--surface-soft);
    }
    .import-row .button {
      width: fit-content;
    }
    .hidden-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
    .import-summary {
      display: none;
      border: 1px solid rgba(15, 118, 110, 0.18);
      border-radius: var(--radius);
      background: #f3fbf9;
      color: var(--primary-ink);
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .import-summary.visible {
      display: block;
    }
    .import-summary.error {
      border-color: rgba(185, 28, 28, 0.28);
      background: #fff3f4;
      color: #9b2530;
    }
    .search-input, .field-input, .field-select, .field-textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      outline: none;
    }
    .search-input, .field-input, .field-select {
      min-height: 38px;
      padding: 8px 10px;
    }
    .field-textarea {
      min-height: 96px;
      resize: vertical;
      padding: 9px 10px;
      line-height: 1.45;
    }
    .search-input:focus, .field-input:focus, .field-select:focus, .field-textarea:focus {
      border-color: rgba(15, 118, 110, 0.62);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }

    .case-list {
      min-height: 0;
      max-height: none;
      overflow: auto;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .case-row {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 12px;
      text-align: left;
      display: grid;
      gap: 8px;
    }
    .case-row:hover, .case-row.active {
      border-color: rgba(15, 118, 110, 0.45);
      background: #fbfffe;
    }
    .case-title {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
      min-width: 0;
    }
    .case-title strong {
      min-width: 0;
      overflow-wrap: anywhere;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.4;
    }
    .case-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .case-topic {
      margin: 0;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .case-question {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .pill {
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--surface-soft);
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .pill.explained {
      cursor: help;
      text-align: left;
    }
    .pill-code {
      color: var(--faint);
      font-family: var(--mono);
      font-weight: 700;
    }
    .pill.high, .pill.priority { color: #b72d3a; background: #fff1f3; border-color: rgba(225, 75, 90, 0.22); }
    .pill.pending { color: #9a5b00; background: #fff8e7; border-color: rgba(213, 137, 24, 0.26); }
    .pill.ready { color: #0b7a48; background: #edfff5; border-color: rgba(34, 168, 102, 0.26); }

    .detail-body {
      min-height: 0;
      max-height: none;
      overflow: auto;
    }
    .detail-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .detail-title {
      display: grid;
      gap: 8px;
    }
    .detail-title h3 {
      margin: 0;
      font-family: var(--mono);
      font-size: 17px;
      overflow-wrap: anywhere;
    }
    .tab-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px 0;
      flex-wrap: wrap;
    }
    .tab-button {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff;
      color: var(--muted);
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
    }
    .tab-button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .empty-state {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field-grid .span-2 { grid-column: span 2; }
    .form-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: #ffffff;
      display: grid;
      gap: 12px;
    }
    .form-section-title {
      margin: 0;
      font-size: 13px;
      font-weight: 900;
      color: var(--text);
    }
    .form-section-note {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .field-label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .field-label-head {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      color: var(--muted);
      line-height: 1.35;
    }
    .requirement-badge {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 7px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.3;
      white-space: nowrap;
    }
    .requirement-badge.required {
      border-color: rgba(185, 28, 28, 0.24);
      background: #fff3f4;
      color: #9b2530;
    }
    .requirement-badge.conditional {
      border-color: rgba(217, 119, 6, 0.26);
      background: #fffaf0;
      color: #9a5b00;
    }
    .requirement-badge.optional {
      border-color: rgba(71, 85, 105, 0.18);
      background: #f8fafc;
      color: var(--faint);
    }
    .field-help {
      margin: 0;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .choice-grid {
      display: grid;
      gap: 8px;
    }
    .check-option {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--text);
      background: var(--surface-soft);
      overflow-wrap: anywhere;
    }
    .check-option strong {
      display: block;
      font-size: 12px;
      line-height: 1.35;
    }
    .check-option small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }
    .check-option input:checked + span strong {
      color: var(--primary-ink);
    }
    .check-option input { margin-top: 2px; }
    .decision-code {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      overflow-wrap: anywhere;
    }
    .data-block {
      display: grid;
      gap: 10px;
    }
    .summary-list {
      display: grid;
      gap: 10px;
    }
    .summary-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface-soft);
    }
    .summary-item h4 {
      margin: 0 0 8px;
      font-size: 13px;
    }
    .summary-item p, .summary-item li {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .summary-item ul {
      margin: 0;
      padding-left: 18px;
    }
    .original-output {
      border: 1px solid rgba(37, 99, 235, 0.16);
      border-radius: var(--radius);
      background: #f6f9ff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .original-output h4 {
      margin: 0;
      font-size: 13px;
    }
    .original-output p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .original-answer {
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .question-list {
      display: grid;
      gap: 8px;
    }
    .question-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 10px;
      display: grid;
      gap: 5px;
    }
    .question-card strong {
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .question-card small {
      color: var(--faint);
      font-size: 11px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .context-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .context-field {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 10px;
      display: grid;
      gap: 6px;
    }
    .context-field.span-2 { grid-column: span 2; }
    .context-label {
      color: var(--faint);
      font-size: 11px;
      font-weight: 900;
    }
    .context-value {
      color: var(--text);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .decision-summary {
      display: grid;
      gap: 10px;
    }
    .decision-summary-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .decision-workflow {
      border: 1px solid rgba(15, 118, 110, 0.18);
      border-radius: var(--radius);
      background: #f3fbf9;
      padding: 10px 12px;
      display: grid;
      gap: 6px;
      color: var(--primary-ink);
      font-size: 12px;
      line-height: 1.5;
    }
    .decision-workflow strong {
      font-size: 12px;
      font-weight: 900;
    }
    .decision-workflow ol {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
    }
    .decision-workflow li + li {
      margin-top: 3px;
    }
    .ai-suggestion {
      border: 1px solid rgba(217, 119, 6, 0.22);
      border-left: 4px solid var(--warning);
      border-radius: var(--radius);
      background: #fffaf0;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .ai-suggestion-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ai-suggestion h4 {
      margin: 0;
      font-size: 13px;
    }
    .ai-suggestion p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .ai-suggestion-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .glossary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .glossary-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface-soft);
      display: grid;
      gap: 8px;
    }
    .glossary-card h4 {
      margin: 0;
      font-size: 13px;
    }
    .glossary-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .glossary-code {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 11px;
      overflow-wrap: anywhere;
    }
    .jump-link {
      width: fit-content;
      border: 1px solid rgba(15, 118, 110, 0.24);
      border-radius: 999px;
      background: #edf6f5;
      color: var(--primary-ink);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
    }
    .evidence-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .evidence-table th, .evidence-table td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .evidence-table th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }
    .evidence-text {
      max-width: 420px;
      color: var(--muted);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .button {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      background: #ffffff;
      color: var(--text);
      font-weight: 800;
      font-size: 12px;
    }
    .button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    .button.blue {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }
    .button:disabled {
      opacity: 0.52;
      cursor: not-allowed;
    }
    .notice {
      border: 1px solid var(--border);
      border-left: 4px solid var(--warning);
      border-radius: var(--radius);
      background: #fffaf0;
      color: #7b4b00;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.45;
    }
    .notice.ok {
      border-left-color: var(--success);
      background: #f0fff7;
      color: #0c6c43;
    }
    .notice.danger {
      border-left-color: var(--danger);
      background: #fff3f4;
      color: #9b2530;
    }
    .notice.authority {
      border-left-color: var(--primary);
      background: #f3fbf9;
      color: var(--primary-ink);
      font-weight: 800;
    }
    .notice strong {
      display: block;
      margin-bottom: 3px;
      color: inherit;
    }
    .pipeline {
      display: grid;
      gap: 10px;
      min-width: 0;
    }
    .pipeline-step {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(96px, 0.28fr) minmax(0, 1fr) minmax(64px, max-content);
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      background: var(--surface-soft);
    }
    .pipeline-step .pill {
      min-width: 0;
      justify-self: end;
      white-space: normal;
      text-align: center;
    }
    .step-label {
      min-width: 0;
      font-weight: 800;
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .step-value {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .sidebar-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 14px;
    }
    .mini-stat {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(129, 140, 160, 0.18);
    }
    .mini-stat:last-child { border-bottom: 0; }
    .mini-stat strong { color: var(--text); }
    .sidebar-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .pipeline.compact {
      gap: 8px;
    }
    .pipeline.compact .pipeline-step {
      grid-template-columns: minmax(72px, 0.34fr) minmax(0, 1fr);
      gap: 8px;
      padding: 9px 10px;
    }
    .pipeline.compact .pipeline-step .pill {
      grid-column: 1 / -1;
      justify-self: start;
    }
    .guide-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      display: grid;
      gap: 6px;
    }
    .guide-list strong { color: var(--text); }

    @media (max-width: 1180px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      .app-shell {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
      .sidebar {
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        height: auto;
        max-height: none;
        overflow: visible;
      }
      .main {
        height: auto;
        max-height: none;
        overflow: visible;
      }
      .kpi-grid { grid-template-columns: repeat(3, minmax(120px, 1fr)); }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
      .queue-panel, .detail-panel {
        display: block;
        height: auto;
      }
      .case-list, .detail-body {
        max-height: none;
        overflow: visible;
      }
    }
    @media (max-width: 960px) {
      .pipeline-step {
        grid-template-columns: 1fr;
        align-items: start;
      }
      .pipeline-step .pill { justify-self: start; }
    }
    @media (max-width: 720px) {
      .main { padding: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field-grid, .checkbox-grid { grid-template-columns: 1fr; }
      .glossary-grid { grid-template-columns: 1fr; }
      .field-grid .span-2 { grid-column: auto; }
      .pipeline-step { grid-template-columns: 1fr; }
    }

，依据《中华人民共和国个人信息保护法》第九条，应当对其个人信息处理活动负责，并采取必要措施保障安全。员工私自导出并出售100万条客户名单（含联系方式），属于个人信息泄露事件，公司可能面临以下风险： 1. 根据《中华人民共和国个人信息保护法》第五十一条，公司未能采取有效的内部管理制度、权限控制和安全技术措施（如加密、去标识化）以防止未经授权的访问和泄露，可能被认定为未尽到安全保护义务，面临行政处罚（包括警告、罚款、责令暂停业务等）； 2. 根据《中华人民共和国个人信息保护法》第五十七条，公司应“立即采取补救措施”并通知履行个人信息保护职责的部门和个人；若未及时履行通知义务或补救不力，可能加重处罚； 3. 民事责任：受影响客户可能提起侵权诉讼，要求公司赔偿损失； 4. 刑事责任风险：如果公司未履行安全保护义务且情节严重，可能构成拒不履行信息网络安全管理义务罪（《刑法》第二百八十六条之一），或者员工构成侵犯公民…","risk_types_from_original_output":["个人信息泄露风险","行政处罚风险","民事赔偿风险","刑事责任风险","内部人员违规","数据泄露","管理失职"],"recommended_actions_from_original_output":["立即采取补救措施，如切断数据泄露渠道、内部排查并报警","按照《中华人民共和国个人信息保护法》第五十七条向履行个人信息保护职责的部门和个人通知泄露情况","加强内部安全管理制度和权限控制，对涉事员工进行内部追责并考虑移送司法机关","评估泄露规模并向监管部门报告，配合调查","完善访问权限、日志审计、异常导出拦截等管理和技术措施"],"why_selected":["高风险 case，错误证据链的业务影响更大。","预筛置信度为 high，适合作为首批人工复核样本。","最终证据缺少 2 个预期主要条文。","有 2 个条文曾在候选层出现但未进入最终 evidence_chain。","有 1 个场景核心条文需要确认是否应进入证据链。","涉及多个法域，适合检查法域边界和证据覆盖。"],"evidence_issue_summary":{"plain_summary":["最终证据缺少 2 个预期主要条文。","场景核心条文缺少 1 个，可能需要校准案由/场景登记。","有 2 个条文曾在候选层出现但未进入最终 evidence_chain。","基础检索层存在缺口，说明不应只依赖 anchor 补救。","证据覆盖对 anchor 依赖较强，法律库扩大后稳定性风险较高。","存在 legal functional typing 或定义条款替代规范条款的复核信号。","Alignment: One or more primary expected legal issues lack matching evidence.","Alignment: Risk outputs include terms or actions not visibly supported by evidence text."],"evidence_context_counts":{"missing_final_expected":2,"missing_scenario_core":1,"lost_evidence":2,"final_evidence":3},"detected_issues":[{"code":"anchor_dependency_review_needed","plain_label":"证据覆盖过度依赖 anchor"},{"code":"anchor_dependent_coverage","plain_label":"anchor 对覆盖有明显补救作用"},{"code":"anchor_masking_base_retrieval_gap","plain_label":"anchor 可能掩盖基础检索薄弱"},{"code":"anchor_rescue_pattern","plain_label":"anchor_rescue_pattern"},{"code":"anchor_rescue_success","plain_label":"anchor_rescue_success"},{"code":"anchor_supported_but_final_lost","plain_label":"anchor 找回的证据未保留到最终证据"},{"code":"answer_evidence_disconnect","plain_label":"答案与证据链可能脱节"},{"code":"base_retrieval_review_nee 和国个人信息保护法","article_no":51,"section_no":"","citation":"[《中华人民共和国个人信息保护法》第五十一条]","functional_type":"operative_rule","content_preview":"第五十一条 个人信息处理者应当根据个人信息的处理目的、处理方式、个人信息的种类以及对个人权益的影响、可能存在的安全风险等，采取下列措施确保个人信息处理活动符合法律、行政法规的规定，并防止未经授权的访问以及个人信息泄露、篡改、丢失： （一）制定内部管理制度和操作规程； （二）对个人信息实行分类管理； （三）采取相应的加密、去标识化等安全技术措施； （四）合理确定个人信息处理的操作权限，并定期对从业人员进行安全教育和培训； （五）制定并组织实施个人信息安全事件应急预案； （六）法律、行政法规规定的其他措施。"},{"source":"中华人民共和国个人信息保护法","article_no":57,"section_no":"","citation":"[《中华人民共和国个人信息保护法》第五十七条]","functional_type":"rights_remedy","content_preview":"第五十七条 发生或者可能发生个人信息泄露、篡改、丢失的，个人信息处理者应当立即采取补救措施，并通知履行个人信息保护职责的部门和个人。通知应当包括下列事项： （一）发生或者可能发生个人信息泄露、篡改、丢失的信息种类、原因和可能造成的危害； （二）个人信息处理者采取的补救措施和个人可以采取的减轻危害的措施； （三）个人信息处理者的联系方式。 个人信息处理者采取措施能够有效避免信息泄露、篡改、丢失造成危害的，个人信息处理者可以不通知个人；履行个人信息保护职责的部门认为可能造成危害的，有权要求个人信息处理者通知个人。"}],"missing_expected_evidence":[{"source":"中华人民共和国个人信息保护法","article_no":66,"section_no":"","citation":"[《中华人民共和国个人信息保护法》第六十六条]","functional_type":"liability","content_preview":"第六十六条 违反本法规定处理个人信息，或者处理个人信息未履行本法规定的个人信息保护义务的，由履行个人信息保护职责的部门责令改正，给予警告，没收违法所得，对违法处理个人信息的应用程序，责令暂停或者终止提供服务；拒不改正的，并处一百万元以下罚款；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。 有前款规定的违法行为，情节严重的，由省级以上履行个人信息保护职责的部门责令改正，没收违法所得，并处五千万元以下或者上一年度营业额百分之五以下罚款，并可以责令暂停相关业务或者停业整顿、通报有关主管部门吊销相关业务..."},{"source":"中华人民共和国个人信息保护法","article_no":69,"section_no":"","citation":"[《中华人民共和国个人信息保护法》第六十九条]","functional_type":"liability","content_preview":"第六十九条 处理个人信息侵害个人信息权益造成损害，个人信息处理者不能证明自己没有过错的，应当承担损害赔偿等侵权责任。 前款规定的损害赔偿责任按照个人因此受到的损失或者个人信息处理者因此获得的利益确定;个人因此受到的损失和个人信息处理者因此获得的利益难以确定的，根据实际情况确定赔偿数额。"}],"missing_scenario_core_evidence":[{"source":"中华人民共和国反不正当竞争法","article_no":10,"section_no":"","citation":"[《中华人民共和国反不正当竞争法》第十条]","functional_type":"definition","content_preview":"第十条 经营者不得实施下列侵犯商业秘密的行为： （一）以盗窃、贿赂、欺诈、胁迫、电子侵入或者其他不正当手段获取权利人的商业秘密； （二）披露、使用或者允许他人使用以前项手段获取的权利人的商业秘密； （三）违反保密义务或者违反权利人有关保守商业秘密的要求，披露、使用或者允许他人使用其所掌握的商业秘密； （四）教唆、引诱、帮助他人违反保密义务或者违反权利人有关保守商业秘密的要求，获取、披露、使用或者允许他人使用权利人的商业秘密。 经营者以外的其他自然人、法人和非法人组织实施前款所列违法行为的，视为侵犯商业秘密。 第三人..."}],"lost_before_final_evi ，是否存在个人信息合规风险？","original_llm_output_excerpt":"存在较高的个人信息合规风险。首先，精准定位信息属于行踪轨迹，依据[《中华人民共和国个人信息保护法》第二十八条]构成敏感个人信息。处理敏感个人信息应当具有特定目的和充分必要性，并采取严格保护措施。该APP在未弹窗告知用户的情况下即收集该信息，违反了[《中华人民共和国个人信息保护法》第十七条]关于处理前应以显著方式、清晰易懂的语言告知处理目的、方式、种类等事项的规定。同时，依据[《中华人民共和国个人信息保护法》第二十九条]，处理敏感个人信息应当取得个人的单独同意，该APP未取得单独同意即收集用于广告推荐，属于违规处理敏感个人信息。此外，将收集的定位信息用于广告推荐，可能构成处理目的变更，需要重新告知并取得同意。综上，该行为涉嫌违反多项法定告知和同意义务，存在行政处罚和民事赔偿责任风险。","risk_types_from_original_output":["敏感个人信息处理风险","告知义务缺失风险","单独同意缺失风险","目的变更未重新告知风险","未履行告知义务","敏感个人信息违规处理"],"recommended_actions_from_original_output":["立即停止在未告知并取得单独同意的情况下收集精准定位信息用于广告推荐","向用户补充弹窗告知处理目的、方式、种类、保存期限等信息，并取得单独同意","如广告推荐未在原告知目的范围内，应重新告知并取得用户同意","对已收集的敏感个人信息进行合规性审查，必要时予以删除或匿名化处理","建立敏感个人信息处理专项合规机制，确保未来处理行为符合法定要求","补充告知并获取单独同意","停止非必要收集"],"why_selected":["高风险 case，错误证据链的业务影响更大。","预筛置信度为 high，适合作为首批人工复核样本。","最终证据缺少 1 个预期主要条文。","有 1 个条文曾在候选层出现但未进入最终 evidence_chain。","已有隔离的 AI 建议草稿，可作为参考，但仍需人工确认。"],"evidence_issue_summary":{"plain_summary":["最终证据缺少 1 个预期主要条文。","有 1 个条文曾在候选层出现但未进入最终 evidence_chain。","基础检索层存在缺口，说明不应只依赖 anchor 补救。","证据覆盖对 anchor 依赖较强，法律库扩大后稳定性风险较高。","存在 legal functional typing 或定义条款替代规范条款的复核信号。","Alignment: One or more primary expected legal issues lack matching evidence.","Alignment: Risk outputs include terms or actions not visibly supported by evidence text.","Coverage: Final evidence_chain does not cover all final expected statutes."],"evidence_context_counts":{"missing_final_expected":1,"missing_scenario_core":0,"lost_evidence":1,"final_evidence":3},"detected_issues":[{"code":"anchor_dependency_review_needed","plain_label":"证据覆盖过度依赖 anchor"},{"code":"anchor_dependent_coverage","plain_label":"anchor 对覆盖有明显补救作用"},{"code":"anchor_masking_base_retrieval_gap","plain_label":"anchor 可能掩盖基础检索薄弱"},{"code":"anchor_rescue_pattern","plain_label":"anchor_rescue_pattern"},{"code":"anchor_rescue_success","plain_label":"anchor_rescue_success"},{"code":"anchor_supported_but_final_lost","plain_label":"anchor 找回的证据未保留到最终证据"},{"code":"answer_evidence_disconnect","plain_labe 是否确实应当进入最终证据链？","曾被召回但没进入最终证据链的条文，是否应当被保留？","原回答中的风险后果、整改动作或结论，哪一项最缺少证据支撑？","当前证据是否只是定义条款，而缺少真正说明义务、责任、程序或后果的条款？","AI 参考建议中的根因和后续动作是否过宽，是否需要人工收窄？","高风险 case 即使预筛有把握，也建议人工看一眼。"],"reason":"存在主要证据缺口、场景核心缺口或候选证据流失，必须由人工最终确认。"}],"next_step":"Use this advisory report and the visual workbench to make real human review decisions. Do not import this report as a completed manual review workbench."},"pilot_review_assist":{"schema_kind":"advisory_pilot_case_review_assist","advisory_packet_only":true,"contains_completed_manual_decisions":false,"assisted_cases":5,"matched_workbench_cases":5,"unmatched_case_ids":[],"needs_user_confirmation_cases":5,"high_attention_manual_review_cases":5,"completed_manual_decisions":0,"promotion_candidates":0,"ready_action_candidates":0},"original_llm_outputs":{"pipl_principles_001":{"answer":"根据《中华人民共和国个人信息保护法》第五条、第六条和第七条，个人信息保护的核心原则包括：合法、正当、必要和诚信原则（第五条）；目的明确合理、直接相关、对个人权益影响最小、收集最小范围原则（第六条）；以及公开、透明原则（第七条）。 术语归纳：个人信息处理原则包括合法、正当、必要、诚信、公开透明以及保证个人信息质量等要求。","answer_confidence":0.95,"source":"rag_eval_report"},"pipl_sensitive_definition_001":{"answer":"根据《中华人民共和国个人信息保护法》第二十八条，敏感个人信息是指一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信息。具体包括：生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息。","answer_confidence":0.99,"source":"rag_eval_report"},"pipl_consent_withdrawal_001":{"answer":"根据《中华人民共和国个人信息保护法》第十五条，个人信息处理者应当提供便捷的撤回同意的方式；个人撤回同意后，不影响撤回前基于个人同意已进行的个人信息处理活动的效力。根据第十六条，处理者不得以个人撤回同意为由拒绝提供产品或者服务，但处理个人信息属于提供产品或者服务所必需的除外。根据第四十七条第三项，个人撤回同意的，个人信息处理者应当主动删除个人信息；若法律、行政法规规定的保存期限未届满或者删除从技术上难以实现，处理者应当停止除存储和采取必要的安全保护措施之外的处理。 术语归纳：个人信息处理者应当提供便捷方式，保障个人撤回同意。","answer_confidence":0.9,"source":"rag_eval_report"},"pipl_data_export_conditions_001":{"answer":"根据《中华人民共和国个人信息保护法》第三十八条，个人信息处理者向境外提供个人信息，应当具备下列条件之一：（一）依照第四十条的规定通过国家网信部门组织的安全评估；（二）按照国家网信部门的规定经专业机构进行个人信息保护认证；（三）按照国家网信部门制定的标准合同与境外接收方订立合同，约定双方的权利和义务；（四）法律、行政法规或者国家网信部门规定的其他条件。此外，依据《中华人民共和国个人信息保护法》第三十九条，还应当向个人告知境外接收方的名称或姓名、联系方式、处理目的、处理方式、个人信息的种类以及个人向境外接收方行使本法规定权利的方式和程序等事项，并取得个人的单独同意。另据《数据出境安全评估办法》第四条，若数据处理者属于关键信息基础设施运营者、处理100万人以上个人信息、自上年1月1日起累计向境外提供10万人个人信息或1万人敏感个人信息等情形，必须通过所在地省级网信部门向国家网信部门申报数据出境安全评估，此时安全评估是强制性条件，其他路径（如标准合同或保护认证）不能替代。 术语归纳：个人信息出境通常需要满足安全评估、个人信息保护认证、标准合同等合规路径，并开展个人信息保护影响评估。","answer_confidence":0.95,"source":"rag_eval_report"},"dsl_data_classification_001":{"answer":"根据《中华人民共和国数据安全法》第二十一条，国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。国家数据安全工作协调机制统筹协调有关部门制定重要数据目录，加强对重要数据的保护。关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理制度。各地区、各部门应当按照数据分类分级保护制度，确定本地区、本部门以及相关行业、领域的重要数据具体目录，对列入目录的数据进行重点保护。","answer_confidence":1.0,"source":"rag_eval_report"},"standard_minimum_necessary_001":{"answer":"根据国家标准《信息安全技术 个人信息安全规范》5.2 收集个人信息的最小必要，对个人信息控制者的要求包括：a）收集的个人信息的类型应与实现产品或服务的业务功能有直接关联（直接关联是指没有上述个人信息的参与，产品或服务的功能无法实现）；b）自动采集个人信息的频率应是实现产品或服务的业务功能所必需的最低频率；c）间接获取个人信息的数量应是实现产品或服务的业务功能所必需的最少数量。","answer_confidence":0.95,"source":"rag_eval_report"},"standard_personal_info_scope_001":{"answer":"根据《信息安全技术 个人信息安全规范》3.1，个人信息控制者应当保护个人信息，即以电子或者其他方式记录的能够单独或者与其他信息结合识别特定自然人身份或者反映特定自然人活动情况的各种信息，包括姓名、出生日期、身份证件号码、个人生物识别信息、住址、通信通讯联系方式、通信记录和内容、账号密码、财产信息、征信信息、行踪轨迹、住宿信息、健康生理信息、交易信息等。同时，根据3.2，控制者对个人敏感信息（一旦泄露、非法提供或滥用可能危害人身和财产安全，极易导致个人名誉、身心健康受到损害或歧视性待遇等的个人信息）需要给予更高程度的保护，具体包括身份证件号码、个人生物识别信息、银行账户、通信记录和内容、财产信息、征信信息、行踪轨迹、住宿信息、健康生理信息、交易信息、14岁以下(含)儿童的个人信息等。","answer_confidence":0.95,"source":"rag_eval_report"},"standard_query_right_001":{"answer":"根据《信息安全技术 个人信息安全规范》8.1，个人信息主体享有查询以下信息的权利：a）个人信息控制者所持有的关于该主体的个人信息或个人信息的类型；b）上述个人信息的来源、所用于的目的；c）已经获得上述个人信息的第三方身份或类型。","answer_confidence":0.95,"source":"rag_eval_report"},"data_export_contract_trigger_001":{"answer":"根据《个人信息出境标准合同办法》第八条，在标准合同有效期内出现下列情形之一的，个人信息处理者应当重新开展个人信息保护影响评估，补充或者重新订立标准合同，并履行相应备案手续：\n（一）向境外提供个人信息的目的、范围、种类、敏感程度、方式、保存地点或者境外接收方处理个人信息的用途、方式发生变化，或者延长个人信息境外保存期限的；\n（二）境外接收方所在国家或者地区的个人信息保护政策和法规发生变化等可能影响个人信息权益的；\n（三）可能影响个人信息权益的其他情形。","answer_confidence":0.99,"source":"rag_eval_report"},"cross_law_export_assessment_001":{"answer":"根据《数据出境安全评估办法》第五条，数据出境安全评估应当重点评估以下内容：（一）数据出境和境外接收方处理数据的目的、范围、方式等的合法性、正当性、必要性；（二）出境数据的规模、范围、种类、敏感程度，数据出境可能对国家安全、公共利益、个人或者组织合法权益带来的风险；（三）境外接收方承诺承担的责任义务，以及履行责任义务的管理和技术措施、能力等能否保障出境数据的安全；（四）数据出境中和出境后遭到篡改、破坏、泄露、丢失、转移或者被非法获取、非法利用等的风险，个人信息权益维护的渠道是否通畅等；（五）与境外接收方拟订立的数据出境相关合同或者其他具有法律效力的文件等是否充分约定了数据安全保护责任义务；（六）其他可能影响数据出境安全的事项。","answer_confidence":0.9999,"source":"rag_eval_report"},"risk_app_location_ads_002":{"answer":"存在较高的个人信息合规风险。首先，精准定位信息属于行踪轨迹，依据[《中华人民共和国个人信息保护法》第二十八条]构成敏感个人信息。处理敏感个人信息应当具有特定目的和充分必要性，并采取严格保护措施。该APP在未弹窗告知用户的情况下即收集该信息，违反了[《中华人民共和国个人信息保护法》第十七条]关于处理前应以显著方式、清晰易懂的语言告知处理目的、方式、种类等事项的规定。同时，依据[《中华人民共和国个人信息保护法》第二十九条]，处理敏感个人信息应当取得个人的单独同意，该APP未取得单独同意即收集用于广告推荐，属于违规处理敏感个人信息。此外，将收集的定位信息用于广告推荐，可能构成处理目的变更，需要重新告知并取得同意。综上，该行为涉嫌违反多项法定告知和同意义务，存在行政处罚和民事赔偿责任风险。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_employee_facial_001":{"answer":"根据《中华人民共和国个人信息保护法》第十七条，处理个人信息前应当以显著方式、清晰易懂的语言真实、准确、完整地告知处理目的、处理方式、个人信息种类和保存期限。本案中，人脸信息属于生物识别信息，依据第二十八条属于敏感个人信息，处理敏感个人信息还须符合第二十九条规定的单独同意以及特定的目的和充分的必要性。公司未告知员工人脸信息的用途和存储期限，违反了法定告知义务，同时可能构成未取得有效单独同意，存在显著法律风险。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_data_export_overseas_001":{"answer":"不合规。根据《数据出境安全评估办法》第四条第二项，处理100万人以上个人信息的数据处理者向境外提供个人信息，应当通过所在地省级网信部门向国家网信部门申报数据出境安全评估。该平台处理超过100万用户个人信息，且向境外传输用户订单数据（包含姓名、电话、地址），属于应当申报安全评估的情形，未申报即违反该项规定。同时，根据《中华人民共和国个人信息保护法》第三十九条，向境外提供个人信息还应向个人告知境外接收方相关信息并取得单独同意。该平台既未申报安全评估，也未履行告知和单独同意义务，整体不合规。","answer_confidence":1.0,"source":"rag_eval_report"},"risk_chatbot_training_001":{"answer":"是的，违规。根据《中华人民共和国个人信息保护法》第十四条第二款，个人信息的处理目的、处理方式和处理的个人信息种类发生变更的，应当重新取得个人同意。该公司原本收集客服聊天记录的目的是提供客服服务（如解答咨询），而训练AI客服模型属于新的处理目的，构成目的变更。由于未获得用户明确同意，违反了该规定。同时，处理姓名、手机号、咨询内容等个人信息也需遵守第六条的最小必要原则。公司不能以原始服务合同或同意为由继续使用这些数据训练模型，必须重新取得用户单独同意或进行匿名化处理。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_privacy_policy_sharing_001":{"answer":"是的，该行为违规。根据《中华人民共和国个人信息保护法》第十七条，个人信息处理者应当在处理个人信息前以显著方式、清晰易懂的语言真实、准确、完整地告知个人信息的处理目的、处理方式、种类等事项，且前款规定事项发生变更的，应当将变更部分告知个人。本案中APP隐私政策未写明向第三方广告平台共享信息，但实际发生共享，既未履行事前告知义务，也未就变更事项进行告知，违反了上述规定。同时，依据《中华人民共和国个人信息保护法》第二十三条，向其他个人信息处理者提供个人信息的，应当向个人告知接收方的名称、联系方式、处理目的、处理方式和个人信息的种类，并取得个人的单独同意。本案中未履行告知义务且未取得单独同意，因此构成违规。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_employee_data_export_001":{"answer":"公司作为个人信息处理者，依据《中华人民共和国个人信息保护法》第九条，应当对其个人信息处理活动负责，并采取必要措施保障安全。员工私自导出并出售100万条客户名单（含联系方式），属于个人信息泄露事件，公司可能面临以下风险：\n1. 根据《中华人民共和国个人信息保护法》第五十一条，公司未能采取有效的内部管理制度、权限控制和安全技术措施（如加密、去标识化）以防止未经授权的访问和泄露，可能被认定为未尽到安全保护义务，面临行政处罚（包括警告、罚款、责令暂停业务等）；\n2. 根据《中华人民共和国个人信息保护法》第五十七条，公司应“立即采取补救措施”并通知履行个人信息保护职责的部门和个人；若未及时履行通知义务或补救不力，可能加重处罚；\n3. 民事责任：受影响客户可能提起侵权诉讼，要求公司赔偿损失；\n4. 刑事责任风险：如果公司未履行安全保护义务且情节严重，可能构成拒不履行信息网络安全管理义务罪（《刑法》第二百八十六条之一），或者员工构成侵犯公民个人信息罪，公司可能面临刑事追责。\n综上，公司应承担行政、民事及潜在的刑事责任，风险等级为高。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_third_party_marketing_001":{"answer":"违法。根据《中华人民共和国个人信息保护法》第十四条，处理个人信息需在充分知情下自愿、明确同意，变更处理目的应重新取得同意。该公司将用户手机号提供给营销公司用于电话推销，属于向其他个人信息处理者提供个人信息，依据《中华人民共和国个人信息保护法》第二十三条，应当向用户告知接收方的名称、联系方式、处理目的、处理方式、个人信息种类，并取得个人的单独同意。本案中未获用户明示同意（单独同意），且手机号未脱敏，违反了上述规定。 未经明示同意向第三方提供手机号用于营销属于违法提供个人信息，可能面临行政处罚或罚款。","answer_confidence":0.98,"source":"rag_eval_report"},"risk_algorithm_bias_001":{"answer":"根据《中华人民共和国个人信息保护法》第二十四条，个人信息处理者利用个人信息进行自动化决策，应当保证决策的透明度和结果公平、公正，不得对个人在交易价格等交易条件上实行不合理的差别待遇。招聘平台使用AI算法筛选简历属于自动化决策，对特定地区求职者给出明显更低的评分，涉嫌基于地域的不合理差别待遇，构成算法歧视风险。个人有权要求平台说明决策依据，并拒绝仅通过自动化决策方式作出对个人权益有重大影响的决定（如是否获得面试机会）。平台应确保算法公平公正，提供对个人特征的选项或拒绝方式，否则可能违反上述规定。建议平台立即审查算法模型，消除地域歧视特征，并公开解释评分逻辑。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_children_data_001":{"answer":"不合规。该儿童游戏APP收集8-12岁儿童的位置、设备信息，属于处理不满十四周岁未成年人个人信息，依据[《中华人民共和国个人信息保护法》第二十八条]构成敏感个人信息。根据[《中华人民共和国个人信息保护法》第三十一条]，处理不满十四周岁未成年人个人信息应取得其父母或者其他监护人的同意，并制定专门的个人信息处理规则。仅用普通用户协议征得家长同意，未满足“单独同意”要求，也未制定专门规则，违反上述规定。 儿童个人信息属于敏感个人信息，处理时应制定专门规则并取得有效监护人同意，仅以普通用户协议概括同意的方式处理存在违规风险。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_data_breach_notification_001":{"answer":"根据《中华人民共和国个人信息保护法》第五十七条，发生个人信息泄露事件后，个人信息处理者应当立即采取补救措施，并通知履行个人信息保护职责的部门和个人。该公司100万条用户信息泄露，且未及时通知用户，违反了该法定义务，存在违规风险。依据第六十六条，未履行个人信息保护义务的，可能面临责令改正、警告、罚款等行政处罚；情节严重的，罚款金额可达五千万元以下或上一年度营业额百分之五以下。建议立即：（1）采取补救措施阻止泄露扩大；（2）按照第五十七条要求通知用户和监管部门；（3）评估是否需要启动应急预案。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_ai_medical_training_export_001":{"answer":"不合规。首先，根据《中华人民共和国个人信息保护法》第二十八条，患者病历属于医疗健康信息，构成敏感个人信息，处理敏感个人信息须具有特定目的和充分必要性，并采取严格保护措施。其次，根据第二十九条，处理敏感个人信息应当取得个人的单独同意，而用户仅取得一般同意，未取得单独同意，违反了敏感个人信息处理规则。此外，将数据同步至境外服务器构成个人信息出境，根据第三十八条，出境需通过安全评估、保护认证或标准合同等合法路径，且应告知境外接收方信息并取得单独同意。本案中未单独告知出境也未取得单独同意，同时未说明已履行出境安全评估等义务，因此整体不合规。 该用途从客服服务转为模型训练，属于处理目的变更和超出原授权范围使用，应重新取得用户明确同意。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_user_profile_overuse_001":{"answer":"存在法律风险。根据《中华人民共和国个人信息保护法》第二十四条第一款，个人信息处理者利用个人信息进行自动化决策，不得对个人在交易价格等交易条件上实行不合理的差别待遇。电商平台基于用户浏览记录分析消费能力并用于差异化定价（价格歧视），属于利用个人信息进行自动化决策且实行了不合理的差别待遇，直接违反该规定。同时，该行为还可能涉及未充分告知自动化决策逻辑、未保证透明度等合规问题。用户可依据第二十四条第三款要求说明并拒绝仅通过自动化决策方式作出的决定。若未提供便捷拒绝方式或未保证公平公正，可能面临行政处罚（最高五千万元或上一年度营业额百分之五罚款）及民事责任。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_data_minimization_violation_001":{"answer":"该行为不合规。根据《中华人民共和国个人信息保护法》第六条，处理个人信息应当具有明确、合理的目的，且收集个人信息应当限于实现处理目的的最小范围，不得过度收集个人信息。该APP核心功能仅为天气查询，要求用户填写职业、收入、婚姻状况等信息与天气查询目的无直接关联，超出了必要范围，构成过度收集个人信息。","answer_confidence":0.98,"source":"rag_eval_report"},"risk_compliant_case_001":{"answer":"该APP收集位置信息用于导航服务，已明确告知并取得单独同意，且提供随时关闭定位权限的撤回同意机制，符合《中华人民共和国个人信息保护法》第十七条（告知义务）、第二十八条（敏感个人信息的处理条件）及第二十九条（单独同意）的规定。用户可随时关闭定位权限，也满足了撤回同意的便捷性要求。因此，该行为合规。 该场景已明确告知处理目的和信息种类，并取得单独同意，且用户可以关闭或撤回定位权限；在用途限于导航服务、收集范围符合必要原则的前提下，整体属于低风险合规情形，应保持现有告知、同意和权限管理措施。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_gray_area_ai_training_001":{"answer":"根据《中华人民共和国个人信息保护法》第四条，匿名化处理后的信息不属于个人信息，因此原则上不适用个人信息处理规则。但需要明确的是，匿名化必须是不可逆的、无法通过合理手段重新识别特定自然人的过程。如果公司未明确说明是否可被重新识别，则存在风险：一旦匿名化不充分，数据可能仍属于个人信息，处理则需遵守《个人信息保护法》第六条（最小必要原则）和第十四条（目的变更需重新取得同意）。当前行为若未对匿名化效果进行充分评估，可能面临违规处理个人信息的风险。建议公司进行匿名化效果评估，确保算法无法重新识别，并保留评估记录。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_contract_auto_renewal_001":{"answer":"根据《中华人民共和国民法典》第四百九十六条，提供格式条款的一方应当采取合理的方式提示对方注意与其有重大利害关系的条款。自动续费条款涉及用户的持续付费义务，属于与用户有重大利害关系的条款。平台未在扣费前以显著方式提醒用户，未履行提示义务，致使用户可能没有注意或理解该条款。依据该条，用户可以主张该条款不成为合同的内容，即该条款对用户不发生效力。同时，若该条款不合理地加重用户责任或限制用户主要权利（如未提供便捷的取消方式），还可能依据《中华人民共和国民法典》第四百九十七条被认定无效。因此，该自动续费条款因未履行显著提醒义务，用户可主张其无效。 自动续费条款属于需要以显著方式提示说明的格式条款。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_labor_dispatch_001":{"answer":"根据检索到的依据材料，仅包含《中华人民共和国民法典》中关于合同履行、代理终止和法人解散的条款，未涉及劳务派遣的相关法律规定。因此，基于现有材料无法判断该公司长期通过劳务派遣形式使用员工从事核心岗位工作是否合法。建议查阅《劳动合同法》《劳务派遣暂行规定》等专门法律法规进行判断。 长期使用派遣安排规避用工义务，可能违反诚实信用原则，应调整用工结构。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_data_leak_contract_001":{"answer":"根据检索到的《中华人民共和国民法典》合同编相关规定，当事人在履行合同过程中应当遵循诚信原则，履行保密等附随义务（《中华人民共和国民法典》第五百零九条第二款）。若一方不履行合同义务或履行不符合约定，应承担继续履行、采取补救措施或赔偿损失等违约责任（《中华人民共和国民法典》第五百七十七条）。然而，当前检索到的依据未包括专门的数据保护法律（如《个人信息保护法》）或行业标准，无法直接针对数据泄露责任分配作出具体认定。在实际纠纷中，法院可能依据合同法原理以及数据安全法等相关规定进行综合裁量。建议补充查阅《个人信息保护法》《数据安全法》等专门法规以获取更完整的责任分配依据。 数据处理协议未约定数据泄露责任分配，属于合同责任不明确，应补充数据安全条款、明确泄露通知、补救措施、违约责任和赔偿机制。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_property_management_001":{"answer":"不合法。根据《中华人民共和国民法典》第二百七十一条，业主对共有部分享有共有和共同管理的权利；第二百八十二条规定，建设单位、物业服务企业等利用业主的共有部分产生的收入，在扣除合理成本后属于业主共有。物业公司未经业主同意，擅自将小区公共区域出租用于广告经营，侵犯了业主对共有部分的共有和共同管理权利，且该经营收入应归业主共有，因此该行为不合法。","answer_confidence":1.0,"source":"rag_eval_report"},"risk_tort_product_liability_001":{"answer":"根据检索到的《中华人民共和国民法典》第一千二百零三条、第一千二百零四条、第一千二百零七条，产品责任的主体是产品的生产者、销售者。如果电商平台以自营方式销售商品（即平台自身作为销售者），则属于法律规定的销售者，应当对产品缺陷造成的损害承担赔偿责任，消费者可以向平台请求赔偿。若平台仅为第三方卖家提供交易场所（非自营），则上述条文未直接规定平台责任，平台是否承担责任需进一步依据《中华人民共和国电子商务法》等相关法律规定判断。现有检索材料不足以完整回答此问题。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_trademark_infringement_001":{"answer":"该行为很可能构成侵犯注册商标专用权。根据《中华人民共和国商标法》第五十七条第一项和第二项，未经商标注册人许可，在同一种商品上使用与其注册商标相同或近似的商标，或者在类似商品上使用相同或近似商标容易导致混淆的，均属侵权。若该知名品牌属于驰名商标，依据《中华人民共和国商标法》第十三条，即使在不相同或不相类似的商品上使用复制、摹仿或翻译的商标，误导公众并可能损害驰名商标注册人利益的，也应不予注册并禁止使用。因此，未经授权在产品包装上使用高度相似的商标标识，若满足上述情形，则构成侵权。 未经许可使用与他人注册商标近似且可能造成混淆的标识，属于商标侵权风险。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_trademark_generic_name_001":{"answer":"企业将行业通用名称注册为商标并独占使用，通常不合法。根据[《中华人民共和国商标法》第十一条]，仅有本商品的通用名称的标志不得作为商标注册，除非经过使用取得显著特征并便于识别。且依据[《中华人民共和国商标法》第五十九条第一款]，即使注册商标中含有的本商品的通用名称，注册商标专用权人也无权禁止他人正当使用。因此，企业不能仅凭注册就独占使用行业通用名称。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_trademark_non_use_001":{"answer":"根据《中华人民共和国商标法》第四十九条第二款，注册商标没有正当理由连续三年不使用的，任何单位或者个人可以向商标局申请撤销该注册商标。该商标连续三年未实际使用，属于法定可被撤销的情形，存在被他人申请撤销的风险。建议公司尽快收集并留存商标实际使用的证据（如带有商标的商品销售合同、发票、广告宣传材料等），如暂无使用计划，可考虑在三年内启动使用以避免被撤销。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_patent_infringement_001":{"answer":"构成侵权。根据《中华人民共和国专利法》第十一条规定，发明和实用新型专利权被授予后，任何单位或者个人未经专利权人许可，不得为生产经营目的制造、销售其专利产品。该企业在未取得专利许可的情况下生产并销售他人已授权的发明专利产品，完全符合该条禁止性行为的构成要件，因此构成专利侵权。 未经许可生产销售他人专利产品，可能构成专利侵权。","answer_confidence":1.0,"source":"rag_eval_report"},"risk_patent_employee_invention_001":{"answer":"根据《中华人民共和国专利法》第六条，公司员工在履行职务过程中完成的技术成果，如果属于“执行本单位的任务”或者“主要是利用本单位的物质技术条件”所完成的发明创造，则构成职务发明创造。职务发明创造申请专利的权利属于该单位，申请被批准后，该单位为专利权人。此外，如果单位与发明人或者设计人订有合同对申请专利的权利和专利权归属作出约定的，从其约定。若非职务发明创造，则申请专利的权利属于发明人或者设计人。","answer_confidence":1.0,"source":"rag_eval_report"},"risk_patent_invalid_001":{"answer":"根据《中华人民共和国专利法》第二十二条，授予专利权的发明和实用新型应当具备新颖性。新颖性要求该发明或者实用新型不属于现有技术；现有技术是指申请日以前在国内外为公众所知的技术。若该企业在申请日前已将其专利技术公开，则该技术属于现有技术，不具备新颖性。依据《中华人民共和国专利法》第四十五条，任何单位或者个人认为该专利权的授予不符合本法有关规定，可以请求国务院专利行政部门宣告该专利权无效。因此，该专利存在被宣告无效的风险。 术语归纳：不具备新颖性的专利可能被提出无效宣告请求。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_company_capital_contribution_001":{"answer":"根据《中华人民共和国公司法》第四十九条，股东应当按期足额缴纳公司章程规定的各自所认缴的出资额。股东未按期足额缴纳出资的，除应当向公司足额缴纳外，还应当对给公司造成的损失承担赔偿责任。此外，若该股东为公司设立时的股东，根据第五十条，设立时的其他股东可能与之在出资不足的范围内承担连带责任，但该条主要规范其他股东的责任，不改变该股东自身承担足额缴纳及赔偿损失的责任。公司还应根据第四十条公示出资信息，股东未实缴可能影响公示信息的真实性，但该条未直接规定股东责任。综上，该股东的核心责任是：向公司补缴出资，并赔偿公司因此遭受的损失。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_company_illegal_dividend_001":{"answer":"不合法。根据《中华人民共和国公司法》第二百一十条，公司分配当年税后利润时，应当先用当年利润弥补亏损，提取法定公积金后，方可向股东分配利润。在未弥补亏损的情况下分配利润，违反了该法规定的利润分配顺序。依据《中华人民共和国公司法》第二百一十一条，公司违反规定向股东分配利润的，股东应当将违反规定分配的利润退还公司；给公司造成损失的，股东及负有责任的董事、监事、高级管理人员应当承担赔偿责任。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_company_related_transaction_001":{"answer":"不合法。根据《中华人民共和国公司法》第一百八十条，董事对公司负有忠实义务，应当采取措施避免自身利益与公司利益冲突，不得利用职权牟取不正当利益。第一百八十一条明确禁止董事违反对公司忠实义务的行为。第一百八十二条规定，董事直接或间接与本公司订立合同或者进行交易，应当就有关事项向董事会或者股东会报告，并按照公司章程的规定经董事会或者股东会决议通过。未经批准与公司进行交易并从中获利，违反了忠实义务及相关程序性规定，属于不合法行为。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_company_share_transfer_001":{"answer":"根据提供的依据材料，无法直接判断有限责任公司股东对外转让股权未通知其他股东是否有效。依据[《中华人民共和国公司法》第八十五条]仅规定了法院强制执行程序中的优先购买权及通知义务，[《中华人民共和国公司法》第八十六条]规定了股权转让后变更股东名册和登记的程序，[《中华人民共和国公司法》第三十二条第一款（六）项]列举了公司登记事项。上述条文均未涉及股东对外转让股权时是否必须通知其他股东、未经通知的效力认定等问题。因此，现有依据不足以回答该问题，建议查阅《中华人民共和国公司法》关于股权转让的其他规定（如第七十一条等）或相关司法解释。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_company_personality_denial_001":{"answer":"根据《中华人民共和国公司法》第二十三条，公司股东滥用公司法人独立地位和股东有限责任，逃避债务，严重损害公司债权人利益的，应当对公司债务承担连带责任。因此，需要承担连带责任。 该类滥用公司法人独立地位逃避债务的情形，属于法人人格否认规则的典型适用场景。","answer_confidence":1.0,"source":"rag_eval_report"},"risk_company_information_disclosure_001":{"answer":"根据《中华人民共和国公司法》第二百零九条，有限责任公司应当按照公司章程规定的期限将财务会计报告送交各股东。股份有限公司的财务会计报告应当在召开股东会年会的二十日前置备于本公司供股东查阅，或依法公告。因此，公司拒绝向股东提供财务会计报告（含财务报表）的行为不合法，违反了法定的送交或置备义务。对于会计账簿等其他财务资料，所提供的依据材料未直接规定股东查阅权，无法就此作出判断。 拒绝向股东提供依法可查阅的财务报表等资料，可能构成股东知情权侵害。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_vat_false_invoice_001":{"answer":"不合法。根据《中华人民共和国增值税法》第三十四条，纳税人应当依法开具和使用增值税发票，虚开发票属于违反发票管理规定的行为。同时，第十四条规定的进项税额抵扣，其前提是必须基于合法合规的增值税发票。通过虚开发票抵扣进项税额，违反上述规定，依据第三十七条，应依照《中华人民共和国税收征收管理法》和有关法律、行政法规的规定追究法律责任。 通过虚开发票抵扣进项税额属于违法行为，可能引发行政处罚或刑事责任。 术语归纳：上述进项税额依法不得抵扣。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_vat_input_deduction_001":{"answer":"根据《中华人民共和国增值税法》第二十二条第（五）项，购进并直接用于消费的餐饮服务对应的进项税额不得从销项税额中抵扣。因此，企业取得的餐饮发票通常属于餐饮服务，若用于集体福利、个人消费或业务招待等直接消费情形，其进项税额不得抵扣。 餐饮服务等非生产经营或个人消费性质支出对应的进项税额，通常不得抵扣。","answer_confidence":1.0,"source":"rag_eval_report"},"risk_vat_tax_rate_misapply_001":{"answer":"存在重大风险。根据[《中华人民共和国增值税法》第十条]，销售适用13%税率的货物必须按13%税率计算缴纳增值税。企业按9%税率开具发票，属于适用税率错误，直接导致少计销项税额，少缴增值税。根据[《中华人民共和国增值税法》第十二条]，纳税人发生应税交易适用不同税率的应当分别核算，未分别核算的从高适用税率。企业故意低开税率，违反了法定税率适用规则，在税务稽查中将被认定为未正确核算和申报。同时，根据[《中华人民共和国增值税法》第三十四条]，纳税人应当依法开具增值税发票，发票税率错误属于未依法开具。该行为可能被税务机关认定为偷税或虚开发票（若涉及故意低开以帮助他人抵扣），面临补缴税款、加收滞纳金、处以罚款（50%至5倍），情节严重的可能涉及刑事责任。建议企业立即自查，对已开具的错误发票作废或红冲后重新按13%税率开具，并主动向税务机关补申报补缴税款。 该情形属于适用税率错误，适用低于法定适用税率的税率开票可能造成少缴税款，应更正发票并补缴税款及滞纳金。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_vat_no_invoice_income_001":{"answer":"该行为不合法。根据[《中华人民共和国增值税法》第三条]，在境内发生应税交易的单位和个人为增值税纳税人，应当依法缴纳增值税。企业取得收入属于应税交易，负有纳税义务。同时，[《中华人民共和国增值税法》第三十四条]要求纳税人依法开具增值税发票。未开具发票且未申报纳税，违反了上述规定，依据[《中华人民共和国增值税法》第三十七条]，应依照《中华人民共和国税收征收管理法》追究法律责任。 未申报纳税和未依法开具发票还可能受到税务行政处罚。","answer_confidence":1.0,"source":"rag_eval_report"},"risk_vat_export_refund_001":{"answer":"不合法。虚报出口金额以获取更多退税属于违反《中华人民共和国增值税法》规定的行为。根据[《中华人民共和国增值税法》第三十七条]，纳税人违反本法规定的，依照《中华人民共和国税收征收管理法》和有关法律、行政法规的规定追究法律责任。同时，[《中华人民共和国增值税法》第三十三条第一款]规定，纳税人出口货物或者跨境销售服务、无形资产适用零税率的，应当向主管税务机关申报办理退（免）税，出口退（免）税的具体办法由国务院制定。虚报出口金额不符合出口退税的真实申报要求，可能构成骗取出口退税，面临行政处罚或刑事追责。 虚报出口金额获取退税属于违法行为，可能构成骗取出口退税或出口退税欺诈，应停止违规申报并退还多获取税款。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_vat_mixed_sales_001":{"answer":"存在风险。根据《中华人民共和国增值税法》第十三条，纳税人发生一项应税交易涉及两个以上税率、征收率的，应当按照应税交易的主要业务适用税率、征收率。销售货物（通常适用13%税率）与提供安装服务（可能适用9%或6%税率）属于一项应税交易，如果统一按低税率（如安装服务税率）纳税，但实际主要业务为销售货物，则可能被税务机关认定为适用税率错误，要求补缴税款并加收滞纳金。建议企业根据合同约定或业务实质准确判断主要业务，并相应适用税率；若无法确定主要业务，应主动与主管税务机关沟通确认，避免因税率适用不当产生税务风险。 该情形属于适用税率错误，适用低于法定适用税率的税率开票可能造成少缴税款，应更正发票并补缴税款及滞纳金。 未区分货物销售和安装服务收入统一按低税率纳税，可能构成混合销售核算风险并导致少缴税款。","answer_confidence":0.9,"source":"rag_eval_report"},"risk_antitrust_price_fixing_001":{"answer":"该行为不合法。根据《中华人民共和国反垄断法》第十七条第一款第一项，禁止具有竞争关系的经营者达成“固定或者变更商品价格”的垄断协议。多家同行企业在行业会议上约定统一提高产品价格，属于典型的横向价格垄断协议，除非能够证明符合《中华人民共和国反垄断法》第二十条规定的豁免情形（例如为改进技术、提高产品质量等），且不会严重限制相关市场竞争并能使消费者分享利益。一般情况下，统一提价很难满足豁免条件，因此该行为涉嫌违法，可能面临反垄断执法机构的调查和处罚。 该协同定价行为属于违法的横向垄断协议，核心表现是固定价格。","answer_confidence":0.98,"source":"rag_eval_report"},"risk_antitrust_market_dominance_001":{"answer":"不合法。根据《中华人民共和国反垄断法》第二十二条第一款第（四）项，禁止具有市场支配地位的经营者没有正当理由，限定交易相对人只能与其进行交易或者只能与其指定的经营者进行交易。该互联网平台在具有市场支配地位的情况下，对商家实施“二选一”排他合作要求，属于典型的限定交易行为，且缺乏正当理由，构成滥用市场支配地位，违反了《中华人民共和国反垄断法》第七条和第二十二条的规定。","answer_confidence":0.98,"source":"rag_eval_report"},"risk_antitrust_concentration_001":{"answer":"存在风险。根据《中华人民共和国反垄断法》第二十六条，经营者集中达到国务院规定的申报标准的，应当事先向国务院反垄断执法机构申报，未申报的不得实施集中。两家大型企业合并若达到申报标准而未申报，属于违法实施集中，国务院反垄断执法机构可以依法进行调查，并可能要求其申报或采取其他措施（如附加限制性条件或禁止集中）。未申报不满足第二十七条规定的豁免情形（如控股关系）时，风险更高。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_unfair_competition_false_promotion_001":{"answer":"不合法。根据《中华人民共和国反不正当竞争法》第九条，经营者不得对其商品的性能、功能等作虚假或者引人误解的商业宣传，虚构产品功能和效果属于该条禁止的行为，欺骗、误导消费者，构成不正当竞争。依据同法第二十五条第二款，违反者将面临责令停止违法行为、罚款（一般情节处一百万元以下罚款，情节严重的处一百万元以上二百万元以下罚款并可能吊销营业执照）等行政处罚。","answer_confidence":0.95,"source":"rag_eval_report"},"risk_unfair_competition_trade_secret_001":{"answer":"根据《中华人民共和国反不正当竞争法》第十条，员工离职后将原公司客户名单带至新公司使用，若该客户名单符合商业秘密的构成要件（即不为公众所知悉、具有商业价值并经权利人采取相应保密措施），则员工的行为可能构成侵犯商业秘密。具体而言，员工违反保密义务或违反权利人有关保守商业秘密的要求，披露、使用或允许他人使用其所掌握的商业秘密，属于该条明确列举的违法行为。新公司若明知或应知该客户名单系通过不正当手段获取，仍获取、披露、使用或允许他人使用，同样视为侵犯商业秘密。因此，该行为是否违法取决于客户名单是否构成商业秘密以及员工是否负有保密义务。 如客户名单具备商业价值并采取了相应保密措施，离职后擅自带至新公司使用可能构成商业秘密侵权。 同时，应补强访问权限、日志审计、异常导出拦截等管理和技术措施。","answer_confidence":0.85,"source":"rag_eval_report"},"risk_unfair_competition_confusion_001":{"answer":"该行为不合法。根据《中华人民共和国反不正当竞争法》第七条，经营者不得实施擅自使用与他人有一定影响的商品名称、包装、装潢等相同或者近似的标识，以及擅自使用他人有一定影响的店铺名称等混淆行为，引人误认为是他人商品或者与他人存在特定联系。商家使用与知名品牌近似的店铺名称和装修风格，导致消费者误认，属于该条规定的混淆行为，违反了《中华人民共和国反不正当竞争法》。","answer_confidence":0.95,"source":"rag_eval_report"},"positive_company_capital_contribution_001":{"answer":"根据《中华人民共和国公司法》第四十七条第一款，有限责任公司全体股东认缴的出资额应自公司成立之日起五年内缴足。若该公司章程约定的出资期限符合该法定要求（即不超过五年），且股东已按期足额缴纳，则不存在法律风险。但若章程约定的出资期限超过五年，即使股东按期缴纳，该约定本身违反强制性规定，存在被要求调整出资期限、承担相应责任的风险。此外，依据《中华人民共和国公司法》第四十九条，股东按期足额缴纳后即履行了出资义务；依据第五十条，若不存在出资不足情形，设立时的其他股东无需承担连带责任。建议核查公司章程约定的出资期限是否符合五年上限，若不符合，应及时修改章程并在五年内缴足。 股东已按期足额缴纳出资，属于依法履行出资义务，整体合法且无违法行为。","answer_confidence":0.85,"source":"rag_eval_report"},"positive_company_dividend_001":{"answer":"根据《中华人民共和国公司法》第二百一十条的规定，公司在弥补亏损、提取法定公积金（税后利润的10%）后，经股东会决议，可从剩余税后利润中提取任意公积金，之后剩余的税后利润，有限责任公司按照股东实缴的出资比例分配（全体股东另有约定除外），股份有限公司按照股东所持股份比例分配（公司章程另有规定除外）。您所述“依法向股东分配利润”的行为符合该条规定的顺序和条件，因此该分配行为是合法的。 公司先弥补亏损并提取法定公积金后依法分配利润，属于合法分红。","answer_confidence":0.95,"source":"rag_eval_report"},"positive_vat_compliance_001":{"answer":"根据检索到的《中华人民共和国增值税法》相关规定，企业如实申报收入并依法开具增值税发票是符合法律规定的行为。该法第三十四条要求纳税人依法开具和使用增值税发票，并积极推广电子发票；第八条规定纳税人应按照计税方法计算缴纳增值税。如实申报收入并依法开票是履行法定义务，通常不会产生税务风险。但需注意，依据第三十七条，若违反本法规定则需依法追究法律责任，因此合规行为本身不存在风险。当前依据材料未直接说明风险内容，但法律逻辑支持无风险判断。","answer_confidence":0.85,"source":"rag_eval_report"},"positive_vat_deduction_001":{"answer":"根据《中华人民共和国增值税法》第十四条，按照一般计税方法计算缴纳增值税的，应纳税额为当期销项税额抵扣当期进项税额后的余额。第二十二条列举了不得抵扣进项税额的情形，包括适用简易计税方法、免征增值税项目、非正常损失、集体福利或个人消费、购进就餐服务等。如果企业取得合法有效的增值税专用发票且用于生产经营活动，只要不属于第二十二条规定的不得抵扣情形，则可以抵扣进项税额。","answer_confidence":0.95,"source":"rag_eval_report"},"positive_antitrust_independent_pricing_001":{"answer":"合法。根据《中华人民共和国反垄断法》第十七条，法律禁止具有竞争关系的经营者达成固定或变更商品价格等垄断协议。企业根据自身成本和市场情况独立制定产品价格，未与竞争对手协商，不存在达成垄断协议的行为。同时，独立定价符合《中华人民共和国反不正当竞争法》第二条规定的自愿、平等、公平、诚信原则，属于正常的市场竞争行为。因此，该行为合法。","answer_confidence":0.95,"source":"rag_eval_report"},"positive_unfair_competition_true_ad_001":{"answer":"不构成不正当竞争。根据《中华人民共和国反不正当竞争法》第九条，禁止的是对商品性能、功能等作虚假或者引人误解的商业宣传，企业在广告中真实描述产品性能且无夸大或虚假内容，符合法律规定，不构成不正当竞争。同时，根据该法第二条，经营者应遵循自愿、平等、公平、诚信原则，真实描述不违反诚信原则和商业道德。 术语归纳：反不正当竞争法禁止的典型不正当竞争行为包括混淆行为、商业贿赂、虚假宣传和侵犯商业秘密等。","answer_confidence":0.95,"source":"rag_eval_report"}},"workbench":{"version":"0.4.7.6.0","scope":"offline manual review workbench export","inputs":{"decision_schema":"tests\\evidence_manual_review_decision_schema.json","decision_schema_version":"0.4.7.5.0"},"csv_fields":["case_id","priority_score","risk_level","expected_domains","queue_tags","issue_types","suggested_root_causes","suggested_follow_up_actions","review_question_count","missing_final_expected_count","missing_scenario_core_count","lost_evidence_count","reviewer","reviewed_at","decision","confirmed_root_causes","rejected_root_causes","confirmed_follow_up_actions","proposed_change_targets","fixture_candidate","rationale","notes"],"summary":{"total_wo 十八条，患者病历属于医疗健康信息，构成敏感个人信息，处理敏感个人信息须具有特定目的和充分必要性，并采取严格保护措施。其次，根据第二十九条，处理敏感个人信息应当取得个人的单独同意，而用户仅取得一般同意，未取得单独同意，违反了敏感个人信息处理规则。此外，将数据同步至境外服务器构成个人信息出境，根据第三十八条，出境需通过安全评估、保护认证或标准合同等合法路径，且应告知境外接收方信息并取得单独同意。本案中未单独告知出境也未取得单独同意，同时未说明已履行出境安全评估等义务，因此整体不合规。 该用途从客服服务转为模型训练，属于处理目的变更和超出原授权范围使用，应重新取得用户明确同意。","why_selected":["高风险 case，错误证据链的业务影响更大。","预筛置信度为 high，适合作为首批人工复核样本。","最终证据缺少 1 个预期主要条文。","有 1 个条文曾在候选层出现但未进入最终 evidence_chain。","有 1 个场景核心条文需要确认是否应进入证据链。","已有隔离的 AI 建议草稿，可作为参考，但仍需人工确认。"],"evidence_issue_summary":{"plain_summary":["最终证据缺少 1 个预期主要条文。","场景核心条文缺少 1 个，可能需要校准案由/场景登记。","有 1 个条文曾在候选层出现但未进入最终 evidence_chain。","基础检索层存在缺口，说明不应只依赖 anchor 补救。","证据覆盖对 anchor 依赖较强，法律库扩大后稳定性风险较高。","存在 legal functional typing 或定义条款替代规范条款的复核信号。","Alignment: One or more primary expected legal issues lack matching evidence.","Alignment: Risk outputs include terms or actions not visibly supported by evidence text."],"evidence_context_counts":{"missing_final_expected":1,"missing_scenario_core":1,"lost_evidence":1,"final_evidence":3},"detected_issues":[{"code":"anchor_dependency_review_needed","plain_label":"证据覆盖过度依赖 anchor"},{"code":"anchor_dependent_coverage","plain_label":"anchor 对覆盖有明显补救作用"},{"code":"anchor_masking_base_retrieval_gap","plain_label":"anchor 可能掩盖基础检索薄弱"},{"code":"anchor_rescue_pattern","plain_label":"anchor_rescue_pattern"},{"code":"anchor_rescue_success","plain_label":"anchor_rescue_success"},{"code":"anchor_supported_but_final_lost","plain_label":"anchor 找回的证据未保留到最终证据"},{"code":"answer_evidence_disconnect","plain_label":"答案与证据链可能脱节"},{"code":"base_retrieval_review_needed","plain_label":"基础检索质量需要复核"},{"code":"core_missing_from_final_evidence","plain_label":"核心条文没有进入最终证据"},{"code":"dense_retrieval_gap","plain_label":"向量检索缺口"},{"code":"evidence_chain_gap_candidate","plain_label":"证据链缺口候选"},{"code":"final_primary_gap","plain_label":"最终证据缺少主要法律依据"},{"code":"final_primary_gap_overlap","plain_label":"final_primary_gap_overlap"},{"code":"final_selection_review_needed","plain_label":"最终证据选择策     function initialLanguage() {
      const languages = asArray(uiConfig.supported_languages).map(language => language.code);
      const fallback = uiConfig.default_language || "zh-CN";
      try {
        const saved = window.localStorage.getItem(languageKey);
        if (saved && languages.includes(saved)) return saved;
      } catch {}
      return languages.includes(fallback) ? fallback : (languages[0] || "zh-CN");
    }

    function languageMessages(language = currentLanguage) {
      const allMessages = uiConfig.messages || {};
      return allMessages[language] || allMessages[uiConfig.default_language] || allMessages["zh-CN"] || {};
    }

    function valueAtPath(source, path) {
      return path.split(".").reduce((node, key) => (
        node && Object.prototype.hasOwnProperty.call(node, key) ? node[key] : undefined
      ), source);
    }

    function t(path, fallback = "") {
      const value = valueAtPath(languageMessages(), path);
      if (value === undefined || value === null || Array.isArray(value) || typeof value === "object") return fallback;
      return String(value);
    }

    function tArray(path, fallback = []) {
      const value = valueAtPath(languageMessages(), path);
      return asArray(Array.isArray(value) ? value : fallback);
    }

    function formatMessage(template, values) {
      return String(template).replace(/\{([a-zA-Z0-9_]+)\}/g, (_, key) => (
        values[key] === undefined || values[key] === null ? "" : String(values[key])
      ));
    }

    function localizedIssue(issue) {
      const [code, detail] = String(issue).split(":");
      const label = t(`draftIssues.${code}`, code);
      return detail ? `${label}: ${detail}` : label;
    }

    function localizedStatus(value) {
      const text = String(value ?? "");
      return t(`statusCodes.${text}`, text);
    }

    function gateStatus() {
      return (closeoutReport.summary || {}).gate_status || "unknown";
    }

    function isGateOpen() {
      return gateStatus() === "open";
    }

    function visibleQueueDefs() {
      return queueDefs.filter(queue => queue.key !== "blocked_intake_gate" || !isGateOpen());
    }

    function gateBadgeClass() {
      if (gateStatus() === "open") return "ready";
      if (gateStatus() === "blocked") return "blocked";
      return "danger";
    }

    function pilotEvidencePreview(evidence) {

    function caseTopic(item) {

        .map(([key]) => sourceLabel(key));

    function contextField(label, value, extra = "") {
      const values = asArray(value);
      if (!values.length) return "";
      const content = values.length > 1
        ? `<div class="case-meta">${values.map(item => pill(item)).join("")}</div>`
        : `<div class="context-value">${escapeHtml(values[0])}</div>`;
      return `
        <div class="context-field ${extra}">

    function glossaryEntry(code) {
      const entry = fieldGlossary[String(code)] || labelGlossary[String(code)] || null;
      if (!entry) return null;
      const pair = currentLanguage === "en-US" ? entry.en : entry.zh;
      return { label: pair[0], description: pair[1], code: String(code) };
    }

    function decisionOptionEntry(code) {
      const entry = decisionOptionGlossary[String(code)] || null;
      if (!entry) return { label: String(code ?? ""), description: "", code: String(code ?? "") };
      const pair = currentLanguage === "en-US" ? entry.en : entry.zh;
      return { label: pair[0], description: pair[1], code: String(code) };
    }

    function reviewQuestionEntry(question) {
      const original = String(question ?? "");
      const entry = reviewQuestionGlossary[original] || null;
      if (!entry) return { label: original, original };
      return {
        label: currentLanguage === "en-US" ? entry.en : entry.zh,
        original,
      };
    }

    function readableLabel(code) {
      const entry = glossaryEntry(code);
      return entry ? entry.label : String(code ?? "");
    }

    function readableTitle(code) {
      const entry = glossaryEntry(code);
      if (!entry) return String(code ?? "");
      return `${entry.label}: ${entry.description}`;
    }

    function explainedPill(code, extra = "") {
      const entry = glossaryEntry(code);
      if (!entry) return pill(code, extra);
      return `<span class="pill explained ${extra}" title="${escapeHtml(entry.description)}">${escapeHtml(entry.label)} <span class="pill-code">/ ${escapeHtml(entry.code)}</span></span>`;

    function assistSignalPreview(signal) {

    function renderPilotReviewAssistPanel(item) {

        contextField(t("decision.pilotBatchAdvisoryFixture", "Advisory regression-test candidate"), advisory.advisory_fixture_candidate === undefined ? "" : (advisory.advisory_fixture_candidate ? t("common.true", "true") : t("common.false", "false"))),

      return `

    function touchDraft(caseId) {
      const draft = caseDraft(caseId);
      draft.updated_at = new Date().toISOString();
      drafts[caseId] = draft;
    }

    function latestDraftUpdatedAt() {
      return Object.values(drafts)
        .map(draft => draft && draft.updated_at)
        .filter(Boolean)
        .sort()
        .pop() || "";
    }

    function formatDateTime(value) {
      if (!value) return "";
      try {
        return new Date(value).toLocaleString(currentLanguage === "en-US" ? "en-US" : "zh-CN");
      } catch {
        return value;
      }
    }

    function exportStatusSummary() {
      const lastExportedAt = exportState.last_exported_at || "";
      const latestUpdatedAt = latestDraftUpdatedAt();
      if (!lastExportedAt) return { state: "never", label: t("exportStatus.never", "Not exported") };
      if (latestUpdatedAt && latestUpdatedAt > lastExportedAt) {
        return { state: "dirty", label: t("exportStatus.dirty", "Unexported changes") };
      }
      return { state: "clean", label: `${t("exportStatus.clean", "Exported")} ${formatDateTime(lastExportedAt)}` };
    }

    function draftSaveSummary(draft) {
      const lastSavedAt = draft && draft.saved_at ? draft.saved_at : "";
      const updatedAt = draft && draft.updated_at ? draft.updated_at : "";
      if (!lastSavedAt) {
        return { state: "never", label: t("draftSave.never", "Not manually saved yet") };
      }
      if (updatedAt && updatedAt > lastSavedAt) {
        return { state: "dirty", label: t("draftSave.dirty", "Unmanually saved updates") };
      }
      return {
        state: "saved",
        label: formatMessage(t("draftSave.savedAt", "Last saved {time}"), { time: formatDateTime(lastSavedAt) }),
      };
    }

    function importStatusSummary() {
      if (!importState.last_imported_at) {
        return { state: "never", label: t("reviewImport.never", "No draft import yet") };
      }
      if (importState.suggestion_rows) {
        return {
          state: importState.error ? "error" : "ready",
          label: formatMessage(t("reviewImport.lastImportedWithSuggestions", "{imported} drafts filled, {suggestions} AI suggestions loaded, {unknown} unmatched, {skipped} empty"), {
            imported: importState.imported_rows || 0,
            suggestions: importState.suggestion_rows || 0,
            cleared: importState.cleared_draft_rows || 0,
            unknown: importState.unknown_rows || 0,
            duplicate: importState.duplicate_rows || 0,
            skipped: importState.skipped_rows || 0,
          }),
        };
      }
      return {
        state: importState.error ? "error" : "ready",
        label: formatMessage(t("reviewImport.lastImported", "{imported} filled, {unknown} unmatched, {skipped} empty"), {
          imported: importState.imported_rows || 0,
          cleared: importState.cleared_draft_rows || 0,
          unknown: importState.unknown_rows || 0,
          duplicate: importState.duplicate_rows || 0,
          skipped: importState.skipped_rows || 0,
        }),
      };
    }

    function renderImportSummary() {
      const target = document.getElementById("import-summary");
      if (!target) return;
      const summary = importStatusSummary();
      target.className = `import-summary ${importState.last_imported_at ? "visible" : ""} ${summary.state === "error" ? "error" : ""}`;
      if (!importState.last_imported_at) {
        target.textContent = "";
        return;
      }
      const prefix = importState.error
        ? formatMessage(t("reviewImport.error", "Import failed: {message}"), { message: importState.error })
        : (importState.suggestion_rows
          ? t("reviewImport.successWithSuggestions", "Rows were matched by case_id; AI prefills were loaded only as suggestions, not manual decisions.")
          : t("reviewImport.success", "Import completed: imported drafts replaced old local drafts so stale drafts cannot mix into the next export."));
      target.textContent = `${prefix} ${summary.label}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function asArray(value) {
      if (Array.isArray(value)) return value.filter(item => item !== null && item !== undefined && String(item).trim() !== "");
      if (value === null || value === undefined || value === "") return [];
      return [value];
    }

    function highPriorityIds() {
      return asArray(workbenchSummary.high_priority_case_ids);
    }

    function pilotBatchCaseIds() {
      return items
        .filter(item => pilotBatchFor(item))
        .sort((left, right) => Number(pilotBatchFor(left).rank || 9999) - Number(pilotBatchFor(right).rank || 9999))
        .map(item => item.case_id);
    }

    function itemByCaseId(caseId) {
      return items.find(item => item.case_id === caseId) || items[0] || null;
    }

    function currentItem() {
      return itemByCaseId(selectedCaseId);
    }

    function caseDraft(caseId) {
      if (!drafts[caseId]) {
        const item = itemByCaseId(caseId);
        const template = item && item.reviewer_input_template ? item.reviewer_input_template : {};
        drafts[caseId] = looksLikeAiAssistedSource(template, payload) ? {} : draftTemplateFromImportRow(template);
      }
      return drafts[caseId];
    }

    function aiSuggestionFor(caseId) {
      return aiSuggestions[caseId] || null;
    }

    function humanDraftForExport(caseId) {
      const draft = drafts[caseId] || {};
      const status = draftStatus(draft);
      if (!status.ready) return {};
      const sanitized = {};
      reviewerDraftFields.forEach(field => {
        if (Object.prototype.hasOwnProperty.call(draft, field)) {
          sanitized[field] = draft[field];
        }
      });
      return sanitized;
    }

    function currentCaseIds() {
      return new Set(items.map(item => item.case_id));
    }

    function draftCaseIdsWithContent() {
      const knownCases = currentCaseIds();
      return Object.keys(drafts).filter(caseId => knownCases.has(caseId) && hasDraftContent(drafts[caseId]));
    }

    function readyDraftCaseIds() {
      return draftCaseIdsWithContent().filter(caseId => draftStatus(drafts[caseId]).ready);
    }

    function blockedDraftCaseIds() {
      return draftCaseIdsWithContent().filter(caseId => !draftStatus(drafts[caseId]).ready);
    }

    function hasDraftContent(draft) {
      if (!draft) return false;
      return Boolean(
        draft.reviewer || draft.reviewed_at || draft.decision ||
        asArray(draft.confirmed_root_causes).length ||
        asArray(draft.rejected_root_causes).length ||
        asArray(draft.confirmed_follow_up_actions).length ||
        asArray(draft.proposed_change_targets).length ||
        draft.fixture_candidate || draft.rationale || draft.notes
      );
    }

    function decisionIsTerminal(decision) {
      return ["confirm_diagnostic_issue", "confirm_scope_adjustment_needed", "reject_diagnostic_issue"].includes(decision);
    }

    function hasOnlyAllowedValues(values, allowed) {
      const allowedSet = new Set(asArray(allowed));
      return asArray(values).every(value => allowedSet.has(value));
    }

    function draftStatus(draft) {
      const issues = [];
      const decision = draft && draft.decision ? draft.decision : "";
      if (!hasDraftContent(draft)) {
        return { ready: false, issues: ["empty_draft"], severity: "pending" };
      }
      if (!draft.reviewer) issues.push("missing_reviewer");
      if (!draft.reviewed_at) issues.push("missing_reviewed_at");
      if (!decision) issues.push("missing_decision");
      if (!draft.rationale) issues.push("missing_rationale");
      if (decision && !asArray(allowedValues.decision).includes(decision)) issues.push("invalid_decision");
      if (!hasOnlyAllowedValues(draft.confirmed_root_causes, allowedValues.confirmed_root_causes)) issues.push("invalid_confirmed_root_cause");
      if (!hasOnlyAllowedValues(draft.rejected_root_causes, allowedValues.rejected_root_causes)) issues.push("invalid_rejected_root_cause");
      if (!hasOnlyAllowedValues(draft.confirmed_follow_up_actions, allowedValues.confirmed_follow_up_actions)) issues.push("invalid_follow_up_action");
      if (decisionIsTerminal(decision) && asArray(draft.confirmed_root_causes).length === 0 && decision !== "reject_diagnostic_issue") {
        issues.push("missing_confirmed_root_cause");
      }
      if (draft.ai_suggestion_applied_at && !draft.human_confirmed_ai_suggestion) {
        issues.push("missing_ai_suggestion_confirmation");
      }
      const targets = asArray(draft.proposed_change_targets).map(value => String(value).trim()).filter(Boolean);
      const blocked = targets.filter(target => prohibitedTargets.includes(target));
      if (blocked.length) issues.push("prohibited_change_target:" + blocked.join("|"));
      return { ready: issues.length === 0, issues, severity: issues.length ? "warning" : "ready" };
    }

    function matchesFilter(item) {
      if (!item) return false;
      const draft = drafts[item.case_id] || {};
      if (currentFilter === "high_priority" && !highPriorityIds().includes(item.case_id)) return false;
      if (currentFilter === "pilot_batch" && !pilotBatchCaseIds().includes(item.case_id)) return false;
      if (currentFilter === "awaiting_manual_review" && item.decision_status !== "pending") return false;
      if (currentFilter === "blocked_intake_gate" && ((closeoutReport.summary || {}).gate_status !== "blocked")) return false;
      if (currentFilter === "with_local_draft" && !hasDraftContent(draft)) return false;
      if (currentFilter === "ready_for_export" && !draftStatus(draft).ready) return false;
      if (!query) return true;
      const haystack = [
        item.case_id,
        caseTopic(item),
        caseContext(item).question,
        asArray(caseContext(item).expected_risk_types).join(" "),
        asArray(caseContext(item).expected_actions).join(" "),
        asArray(caseContext(item).scenario_contexts).map(scenario => [scenario.scenario_id, scenario.description, scenario.domain].join(" ")).join(" "),
        item.risk_level,
        asArray(item.expected_domains).join(" "),
        asArray(item.queue_tags).join(" "),
        asArray(item.issue_types).join(" "),
        asArray(item.suggested_root_causes).join(" "),
        asArray(item.suggested_follow_up_actions).join(" "),
        pilotBatchFor(item) ? asArray(pilotBatchFor(item).why_selected).join(" ") : "",
        pilotBatchFor(item) ? asArray((pilotBatchFor(item).evidence_issue_summary || {}).plain_summary).join(" ") : "",
        pilotBatchFor(item) ? ((pilotBatchFor(item).prescreen_advice || {}).plain_language_guidance || "") : "",
        pilotBatchFor(item) ? ((pilotBatchFor(item).ai_suggestion || {}).advisory_decision || "") : "",
        pilotReviewAssistFor(item) ? (pilotReviewAssistFor(item).advisory_tendency_label || "") : "",
        pilotReviewAssistFor(item) ? (pilotReviewAssistFor(item).support_status_label || "") : "",
        pilotReviewAssistFor(item) ? asArray(pilotReviewAssistFor(item).focus_questions_for_user).join(" ") : "",
      ].join(" ").toLowerCase();
      return haystack.includes(query.toLowerCase());
    }

      const visible = items.filter(matchesFilter);

      return visible.sort((left, right) => (
        (rankByCaseId.get(left.case_id) ?? 9999) - (rankByCaseId.get(right.case_id) ?? 9999)
      ));
    }

    function updateDraftFromInput(caseId, target) {
      const field = target.getAttribute("data-field");
      if (!field) return;
      const draft = caseDraft(caseId);
      if (["confirmed_root_causes", "rejected_root_causes", "confirmed_follow_up_actions"].includes(field)) {
        const checked = Array.from(document.querySelectorAll(`[data-field="${field}"]:checked`)).map(input => input.value);
        draft[field] = checked;
      } else if (field === "fixture_candidate" || field === "human_confirmed_ai_suggestion") {
        draft[field] = target.checked;
      } else if (field === "proposed_change_targets") {
        draft[field] = target.value.split("|").map(value => value.trim()).filter(Boolean);
      } else {
        draft[field] = target.value;
      }
      touchDraft(caseId);
      window.localStorage.setItem(stateKey, JSON.stringify(drafts));
      renderQueues();
      renderSideStatus();
      renderBadges();
      const item = itemByCaseId(caseId);
      if (item && item.case_id === selectedCaseId) {
        renderDetailHeader(item, draft, draftStatus(draft));

    function buildFilledWorkbench() {
      const readyIds = new Set(readyDraftCaseIds());
      const clonedItems = items.filter(item => readyIds.has(item.case_id)).map(item => ({
        ...item,
        pilot_batch: undefined,
        pilot_review_assist: undefined,
        reviewer_input_template: humanDraftForExport(item.case_id),
      }));
      const exportedCaseIds = clonedItems.map(item => item.case_id);
      return {
        version: payload.version,
        scope: "filled visual manual review workbench export",
        exported_at: new Date().toISOString(),
        source_workbench_version: workbench.version,
        workbench_fingerprint: workbenchFingerprint,
        source_imported_case_ids: asArray(importState.imported_case_ids),
        advisory_packet_only: false,
        contains_completed_manual_decisions: clonedItems.length > 0,
        csv_fields: csvFields,
        guardrails,
        summary: {
          total_source_workbench_items: items.length,
          total_workbench_items: clonedItems.length,
          exported_draft_items: clonedItems.length,
          exported_case_ids: exportedCaseIds,
          local_draft_items: draftCaseIdsWithContent().length,
          ready_draft_items: readyIds.size,
          blocked_draft_items: blockedDraftCaseIds().length,
          pilot_checklist_marked_cases: Object.values(pilotChecklistState).filter(value => value && value.reviewed).length,
          export_policy: "ready_human_drafts_only",
        },
        workbench_items: clonedItems,
      };
    }

    function csvEscape(value) {
      const raw = Array.isArray(value) ? value.join(" | ") : String(value ?? "");
      const text = /^[=+\-@]/.test(raw.trim()) ? "'" + raw : raw;
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function csvForWorkbench(data) {
      const rows = [csvFields.join(",")];
      data.workbench_items.forEach(item => {
        const template = item.reviewer_input_template || {};
        const counts = item.evidence_context_counts || {};
        const row = {
          case_id: item.case_id,
          case_topic: (item.case_context && item.case_context.case_topic) || "",
          question: (item.case_context && item.case_context.question) || "",
          priority_score: item.priority_score,
          risk_level: item.risk_level,
          expected_domains: asArray(item.expected_domains),
          queue_tags: asArray(item.queue_tags),
          issue_types: asArray(item.issue_types),
          suggested_root_causes: asArray(item.suggested_root_causes),
          suggested_follow_up_actions: asArray(item.suggested_follow_up_actions),
          review_question_count: asArray(item.suggested_review_questions).length,
          missing_final_expected_count: counts.missing_final_expected || 0,
          missing_scenario_core_count: counts.missing_scenario_core || 0,
          lost_evidence_count: counts.lost_evidence || 0,
          reviewer: template.reviewer || "",
          reviewed_at: template.reviewed_at || "",
          decision: template.decision || "",
          confirmed_root_causes: asArray(template.confirmed_root_causes),
          rejected_root_causes: asArray(template.rejected_root_causes),
          confirmed_follow_up_actions: asArray(template.confirmed_follow_up_actions),
          proposed_change_targets: asArray(template.proposed_change_targets),
          fixture_candidate: template.fixture_candidate ? "true" : "false",
          rationale: template.rationale || "",
          notes: template.notes || "",
        };
        rows.push(csvFields.map(field => csvEscape(row[field])).join(","));
      });
      return rows.join("\n");
    }

    function download(filename, mime, text) {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function confirmExport(kind, data) {
      const readyIds = data.summary.exported_case_ids || [];
      if (!readyIds.length) {
        window.alert(t("exportPreview.none", "No drafts are ready to export. Fill required fields first."));
        return false;
      }
      const blocked = data.summary.blocked_draft_items || 0;
      const previewLines = [
        formatMessage(t("exportPreview.ready", "This export will include {ready} ready drafts: {cases}"), {
          ready: readyIds.length,
          cases: readyIds.join(", "),
        }),
      ];
      if (blocked) {
        previewLines.push(formatMessage(t("exportPreview.blocked", "{blocked} incomplete drafts will not be exported."), { blocked }));
      }
      previewLines.push(t(kind === "csv" ? "exportPreview.confirmCsv" : "exportPreview.confirmJson", "Export these drafts?"));
      return window.confirm(previewLines.join("\n"));
    }

    function exportJson() {
      const data = buildFilledWorkbench();
      if (!confirmExport("json", data)) return;
      download("filled_manual_review_workbench.json", "application/json;charset=utf-8", JSON.stringify(data, null, 2));
      markExported();
    }

    function exportCsv() {
      const data = buildFilledWorkbench();
      if (!confirmExport("csv", data)) return;
      download("filled_manual_review_workbench.csv", "text/csv;charset=utf-8", "\ufeff" + csvForWorkbench(data));
      markExported();
    }

        local_draft_items: draftCaseIdsWithContent().length,
        ready_draft_items: readyIds.length,
        blocked_draft_items: blockedDraftCaseIds().length,
        exported_draft_items: readyIds.length,
        exported_case_ids: readyIds,

      renderSideStatus();

      const draft = caseDraft(caseId);
      const now = new Date().toISOString();
      if (!draft.updated_at) draft.updated_at = now;
      draft.saved_at = now;
      drafts[caseId] = draft;

      renderQueues();
      renderSideStatus();
      renderBadges();

        renderDetailHeader(item, draft, draftStatus(draft));

    function applyAiSuggestion(caseId) {
      const suggestion = aiSuggestionFor(caseId);
      if (!suggestion) return;
      const draft = caseDraft(caseId);
      aiSuggestionFields.forEach(field => {
        if (Object.prototype.hasOwnProperty.call(suggestion, field)) {
          draft[field] = Array.isArray(suggestion[field]) ? [...suggestion[field]] : suggestion[field];
        }
      });
      draft.notes = [draft.notes, t("decision.aiSuggestionCopied", "AI suggestion copied. Please manually confirm reviewer, date, decision, and rationale.")]
        .filter(Boolean)
        .join("\n");
      draft.ai_suggestion_applied_at = new Date().toISOString();
      draft.human_confirmed_ai_suggestion = false;
      touchDraft(caseId);
      window.localStorage.setItem(stateKey, JSON.stringify(drafts));
      render();
    }

    function clearAiSuggestion(caseId) {
      delete aiSuggestions[caseId];
      persistAiSuggestions();
      render();
